 au Centre Commercial Le Forum","Les soins dentaires Découvrez tous les soins dentaires proposés par notre cabinet 1. Le Détartage et le Polissage Le détartrage consiste à enlever la plaque dentaire et le tartre accumulés sur vos dents. Il aide à prévenir les maladies des gencives et les caries. Le polissage, quant à lui, rend vos dents lisses et brillantes après le détartrage.","Les caries sont des trous qui se forment dans les dents à cause des bactéries. Pour les traiter, le dentiste retire la partie abîmée de la dent et la remplit avec un matériau spécial, appelé « composite » à base de résine.","Si une dent est trop abîmée pour être réparée avec un simple composite, le dentiste peut vous conseiller ce type de soin. C’est une sorte de « coiffe » qui recouvre partiellement ou totalement la dent et la renforce.","Les prothèses sont des appareils qui remplacent une ou plusieurs dents manquantes. Elles sont conçues pour retrouver une fonction masticatoire et un sourire naturels. L’inconvénient de ces méthodes est d’avoir un confort perfectible, et surtout d’accélérer la perte des dents restantes et la résorption de l’os. C’est pour ces raisons que la solution implantaire est maintenant la solution de choix…"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodon
