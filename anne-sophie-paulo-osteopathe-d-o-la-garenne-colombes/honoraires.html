 troubles respiratoires. L’ostéopathie peut aussi aider pour les troubles du sommeil, de l’attention, les infections ORL à…","Nous accompagnons la femme à chaque étape de sa vie : douleurs pelviennes, syndromes prémenstruels , règles douloureuses, grossesse (lombalgies, sciatiques, reflux, préparation à l’accouchement...), post-partum et ménopause. Nous intervenons également dans des situations plus complexes comme l’ endométriose , l’adénomyose, les parcours de PMA , ou les suites opératoires, en soutien global du…","Préparation d’épreuves et optimisation des performances : douleurs articulaires ou musculaires, tendinites, périostites, contractures, pubalgie, capacités respiratoires. Prévention des blessures. Récupération et traitement des traumatismes : entorses, chocs, chutes, blessures..."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"menti
