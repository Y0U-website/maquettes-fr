rtenaires avec la majorité des mutuelles. Notre équipe prend en charge le suivi administratif de votre dossier et effectue les démarches directement auprès des différents organismes.","Nous sommes implantés dans toute la France pour être toujours plus proches de nos patients. Et de nouveaux centres Docali ouvrent leurs portes régulièrement. Chaque centre Docali est conçu pour vous offrir un accueil chaleureux et attentif.","Nous vous accueillons du lundi au vendredi dans nos 18 centres à travers la France. Découvrez le centre le plus proche de chez vous.","L’entretien de votre santé bucco-dentaire est essentiel. Que ce soit pour un simple bilan dentaire ou pour des soins sur plusieurs séances, vous serez pris en charge par une équipe unique : un chirurgien-dentiste et un assistant dentaire vous prodigueront les soins dont vous avez besoin."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"docali-rouen-centre-dentaire-saint-sever","titre":"Rouen"},{"route":"a-propos","titre":"À Propos de nos centres den
