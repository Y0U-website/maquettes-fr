e est un moment idéal pour commencer un traitement orthodontique. La croissance rapide du patient lors de cette période permet de corriger plus facilement les malocclusions, notamment les décalages squelettiques.","Bien qu’un traitement orthodontique sera idéalement conduit chez un patient n’ayant pas encore terminé sa croissance, il n’est jamais trop tard pour en bénéficier. Soucieux de la discrétion de votre traitement, nous proposons des techniques discrètes , dont les aligneurs transparents.","Au cabinet d’orthodontie du Dr Frédéric Bodart, nous proposons les traitements par aligneurs transparents pour corriger le positionnement de vos dents. Confortables, amovibles et presque invisibles , ces gouttières assurent un traitement efficace en s’adaptant facilement à votre quotidien.","La Haute autorité de Santé (HAS) recommande une consultation chez l’orthodontiste aux alentours de 7 ans. En cas de trouble d’évolution des dents ou des mâchoires, une première phase dite « interceptive » peut parfois être indiquée.","Les soins d’orthodontie peuvent être remboursés par la sécurité sociale et/ou votre mutuelle :"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursemen
