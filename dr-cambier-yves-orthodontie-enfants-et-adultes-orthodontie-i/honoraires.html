ent depuis chez vous . Il vous suffit de prendre des photos de votre bouche avec votre smartphone et de les envoyer à votre orthodontiste , qui analysera les images et ajustera le traitement si nécessaire. Cela vous permet de bénéficier d’un suivi personnalisé, tout en réduisant les déplacements.","Nous mettons un point d’honneur à offrir à nos patients des soins de la plus haute qualité en utilisant des technologies modernes et efficaces. Chaque aspect de votre traitement est soigneusement étudié pour garantir une précision maximale et un confort optimal. Notre objectif est de vous offrir une expérience agréable, en minimisant les contraintes tout en assurant un suivi personnalisé tout au…","Prise d’empreinte numérique L’empreinte optique est une méthode innovante et sans inconfort pour prendre des moulages numériques de la bouche. À l’aide d’un scanner intra-oral, cette technique capte des images précises des dents et des gencives, qui sont ensuite transformées en modèles 3D. Elle remplace les anciennes empreintes en pâte et permet de concevoir des appareils dentaires, des couronnes…","Cone Beam Le Cone Beam est une technologie de radiographie 3D qui permet de réaliser des images très précises de la structure dentaire et des tissus voisins. Grâce à cet appareil, les chirurgiens-dentistes peuvent obtenir une vue détaillée des os , des dents et des articulations , facilitant ainsi le diagnostic et la planification des traitements. Il est particulièrement utile pour les implants…"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen,
