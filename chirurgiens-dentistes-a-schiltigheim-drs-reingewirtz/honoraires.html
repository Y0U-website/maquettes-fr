t."],"corps":""},{"id":"suivi","align":"left","rail":"Le suivi","kicker":"04 — Le suivi","titre":["Ce qui se corrige","dans la durée."],"corps":""},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":""}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[],"titre":["Le cabinet"],"lede":"","paragraphes":["Le Cabinet dentaire des Dr Nathalie et Yves REINGEWIRTZ, Chirurgiens-Dentistes à Schiltigheim près de Strasbourg (67) est heureux de vous accueillir sur son nouveau site Internet destiné à vous communiquer les meilleures informations de prévention et de santé bucco-dentaire .","La dent est isolée de la salive, puis nettoyée afin d’éliminer la plaque dentaire et les débris alimentaires. Le chirurgien-dentiste applique ensuite une résine en surface afin de combler les sillons. C’est une intervention totalement indolore et donc sans anesthésie. Elle est pratiquée après un nettoyage minutieux des dents.","L’indication du scellement de sillons passe par l’évaluation du Risque Carieux Individuel (RCI). Les enfants qui présentent déjà plusieurs caries, ou des sillons très profonds, sont particulièrement concernés.","En procédant à une évaluation du RCI de votre enfant vous serez en mesure d’agir plus efficacement pour éviter d’éventuelles caries. Cette évaluation permettra ainsi à votre chirurgien-dentiste de vous préciser les mesures de prévention de santé bucco-dentaire qui le concernent, et de lui prodiguer les soins adaptés.","Le RCI est classé en deux catégories : risque élevé’ ou faible’.","Il sera défini après un questionnaire précis ( ge, antécédents familiaux, hygiène bucco-dentaire, régime alimentaire ), un examen clinique (présence de plaque dentaire, morphologie des dents ) et un bilan radiologique (en fonction de l’ ge du patient). Il est recommandé de le réévaluer périodiquement (tous les 3 à 6 mois) car il peut varier au cours du temps.","Précédent Pourquoi l excès de sucre est-il mauvais pour les dents ?","Partager Twitter Partager Partager Envoyer Copier Cabinet dentaire des Drs Nathalie et Yves REINGEWIRTZ 9 rue du Tribunal 67300 SCHILTIGHEIM"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"prevention-des-caries-chez-l-enfant-le-scellemen","titre":"Prévention des caries chez…"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lignes":["Honoraires"]},"pied":{"note":"","badge":"Proposition de maquette"},"demo":true}</script>
