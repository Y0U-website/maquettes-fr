ite Kathy secrétaire médicale","Le docteur Aude Le Corre est le chirurgien qui vous accueille en consultation et vous opère. Aude Le Corre traite toutes les pathologies de la main et du poignet. Elle a obtenu à la faculté de médecine de Nantes le DU (Diplôme Universitaire) Microchirurgie, le DU Chirurgie de la main et du membre supérieur, le DESC (Diplôme d’Etudes Spécialisées Complémentaires) Chirurgie orthopédique et…","Marina est l’infirmière du cabinet, elle est affectée à la salle de pansements. Elle intervient à chaque étape de votre parcours de soin, depuis l’entretien pré-consultation jusqu’à l’intervention au bloc opératoire sans oublier la pose de pansements post-opératoires. Aussi, Marina accueille les patients pour les urgences médicales de la main au sein de la Clinique Mutualiste de Bretagne…"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"presentation-chirurgien-de-la-main-aude-le-corre","titre":"Chirurgien orthopédiste"},{"route":"cabinet-chirurgien-main-aude-le-corre-html","titre":"C
