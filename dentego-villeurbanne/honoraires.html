 à Villeurbanne :","Notre centre dentaire de Villeurbanne est équipé des dernières technologies , notamment en matière de radiologie. Vous avez ainsi la possibilité de passer une radio panoramique, céphalo, rétro-alvéolaire ou encore un scanner 3D . Ces équipements permettent aux dentistes d’établir un diagnostic toujours plus fiable. Les centres dentaires Dentego offrent également certaines garanties, notamment en…","En effet, notre volonté est de mettre à disposition de tous des soins de qualité. C’est pourquoi nous proposons le tiers payant et des facilités de paiement . Avant toute intervention, un devis transparent est d’ailleurs établi par le dentiste qui vous prend en charge.","Situé au 111, cours Émile Zola, le centre dentaire Dentego se trouve en plein cœur de Villeurbanne (69 100), à l’intersection des quartiers Buers, Gratte Ciel et Grand Clément. Ainsi, votre dentiste à Villeurbanne est facilement accessible, où que vous habitiez dans le département du Rhône, et quel que soit votre moyen de transport, voiture, bus ou métro (arrêt République Villeurbanne).","Il est important de consulter régulièrement un dentiste à Villeurbanne, et cela même si vous ne ressentez aucune douleur. Nous vous recommandons de prendre rendez-vous environ une fois par an au centre dentaire Dentego, afin que votre praticien puisse effectuer un bilan bucco-dentaire complet, et ainsi prévenir tout problème dentaire. Vous avez des enfants ? Emmenez-les chez un dentiste dès l’âge…"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps"
