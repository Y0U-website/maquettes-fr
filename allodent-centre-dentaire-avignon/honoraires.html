emplacer une racine,","pas seulement une dent."],"corps":"L’implant dentaire est une racine artificielle ancrée dans l’os , qui remplace une racine naturelle absente ou perdue lors de la perte ou l’extraction d’une dent, cette racine artificielle permettra par la suite de fixer une couronne ou prothèse."},{"id":"suivi","align":"left","rail":"Orthodontie","kicker":"04 — Orthodontie","titre":["Aligner sans","se cacher."],"corps":"Plusieurs raisons peuvent conduire un patient à faire appel à l’orthodontie et à vouloir redresser les dents , notamment pour les dents définitives. Il y a l’overbite, recouvrement vertical ou supraclusion, quand les dents inférieures sont recouvertes par les…"},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":""}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[],"titre":["Le cabinet"],"lede":"","paragraphes":["Quels sont les différents types d’implants dentaires disponibles dans notre centre d’Aix-en-Provence ? Allodent Le professionnel de santé dentaire utilise un seul type d’implant dentaire :","Nous réalisons les implants dentaires en titane dans notre centre dentaire Allodent à Aix-en-Provence.","En général, les implants dentaires sont conçus pour être durables et offrent une solution à long term e pour remplacer une dent manquante. Avec des soins appropriés et une bonne hygiène bucco-dentaire, un implant dentaire peut durer de nombreuses années, voire toute une vie.","Il est important de souligner que la durée de vie d’un implant dentaire peut également être activée par des facteurs tels que le bruxisme (grincement des dents), les maladies parodontales, le tabagisme et certaines conditions médicales qui peuvent affecter la santé des gencives et de l’os.","La pose d’un implant dentaire est un processus en plusieurs étapes qui nécessite une planification rigoureuse et la coordination entre le dentiste et le spécialiste en implantologie. Voici les grandes étapes du processus de pose d’un implant dentaire :","Après la pose de l’implant, une phase de guérison est nécessaire pour permettre à l’os de se fusionner avec l’implant, un processus appelé ostéo-intégration . Cette phase peut durer plusieurs mois , pendant lesquels vous devrez suivre les instructions de soins post-opératoires et éviter de solliciter excessivement la zone traitée.","Comment se passe la deuxième phase d’intervention ? Une fois que l’ostéo-intégration est complète et que l’implant est solidement ancré dans l’os, une deuxième intervention est réalisée pour fixer l’élément prothétique sur l’implant. Cela peut être une couronne dentaire, un bridge ou une prothèse dentaire complète, en fonction de vos besoins spécifiques.","Après la pose de l’implant dentaire et la mise en place de l’élément prothétique, il est important de suivre régulièrement des visites chez votre dentiste pour évaluer la santé de l’implant et effectuer des nettoyages professionnels."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"implants-dentaires","titre":"Implant dentaire à Aix-en-Provence"},{"route":"implants-dentaires-2","titre":"Implant dentaire à Saint-Cannat"},{"route":"pedodontie","titre":"Soins dentaires enfants"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lignes":["Honoraires"]},"pied":{"note":"","badge":"Proposition de maquette"},"demo":true}</script>
