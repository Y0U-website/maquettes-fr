s dents naturelles en évitant la pose d’implants ou de prothèses. Plusieurs phases sont relatives à l’endodontie : la prévention, le diagnostic et le traitement des maladies de la pulpe visant à transformer les dents pathologiques en dents saines et fonctionnelles.","Un traitement endodontique est possible en cas de caries dentaires profondes, de traitements dentaires répétés sur la même dent, de fêlures ou encore de fractures dentaires.","Afin de remplacer des dents abîmées ou manquantes, les prothèses dentaires sont de précieuses alliées. Plusieurs millions de Français ont déjà opté pour cette solution que le praticien adapte bien sûr à chaque patient. Il existe en effet plusieurs types de prothèses et d’implants dentaires :","Que ce soit pour optimiser les principales fonctions buccales que sont la mastication et la phonation, ou dans une perspective purement esthétique, les prothèses dentaires présentent de nombreux avantages. La solution la plus adéquate sera déterminée en fonction des besoins du patient, et de la morphologie de sa mâchoire.","Vous pourriez avoir recours à un traitement orthodontique si l’une des situations suivantes s’applique à votre cas :","Pour corriger l’une des situations évoquées, deux solutions s’offrent à vous :"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui
