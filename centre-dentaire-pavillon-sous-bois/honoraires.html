uelques vraies feuilles, repiquez-les en godets individuels.","Plantez dehors quand tout risque de gel est passé. Choisissez un emplacement en plein soleil. Amendez le sol avec du compost ou un engrais organique avant la mise en place."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"tomates-fendues-chaque-ete-cette-tomate-cerise-p","titre":"Tomates fendues chaque été"},{"route":"ce-fruitier-tropical-resiste-au-froid-sans-trait","titre":"Ce fruitier tropical résiste au…"},{"route":"cette-plante-grimpante-aux-fleurs-xxl-pousse-tre","titre":"Cette plante grimpante aux fleurs…"},{"route":"cest-le-mois-ideal-les-legumes-a-planter-avant-f","titre":"\"C est le mois idéal !\""},{"route":"elue-plante-du-siecle-cette-vivace-bleue-a-plant","titre":"Élue \"plante du siècle\", cette…"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires d
