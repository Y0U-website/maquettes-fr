ail":"Implantologie","kicker":"03 — Implantologie","titre":["Remplacer une racine,","pas seulement une dent."],"corps":"Avant la pose d’une prothèse dentaire (implant, couronne, bridge…), un traitement orthodontique peut être proposé pour réaligner les dents et optimiser l’espace. Cela permet d’assurer un résultat plus stable, fonctionnel et esthétique."},{"id":"suivi","align":"left","rail":"Orthodontie","kicker":"04 — Orthodontie","titre":["Aligner sans","se cacher."],"corps":"Aligner les dents, harmoniser le sourire et rééquilibrer les fonctions pendant l’adolescence."},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":"Retrouver même à l’âge adulte un alignement fonctionnel, esthétique et confortable"}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[{"valeur":"3","label":"Jours d’ouverture par semaine"},{"valeur":"1","label":"Praticien"}],"titre":["Le cabinet"],"lede":"","paragraphes":["Les dernières innovations pour assurer précision, confort et résultats durables : Scanner intra-oral 3D, imprimante 3D pour gouttières sur mesure, radiographie panoramique numérique.","Les patients bénéficient à chaque étape de leur traitement d’explications claires et d’un suivi documenté. L’objectif : garantir la compréhension, l’adhésion et la continuité des soins.","Seuls les praticiens ayant suivi une spécialisation reconnue après le doctorat en chirurgie dentaire peuvent porter le titre de Spécialiste Qualifié en Orthodontie.","Situé au cœur de Charly, tout près de Lyon, le cabinet du Dr Labourel vous accueille dans un espace moderne, lumineux et apaisant. Chaque détail a été imaginé pour offrir un cadre confortable et rassurant, aussi bien aux enfants qu’aux adultes.","Grâce à des outils n
