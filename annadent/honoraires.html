ns aux implants, une étude précise est réalisée : attentes du patient, questionnaire médical, examen bucco-dentaire, radiographies, scanner, images 3D Nous obtenons les informations indispensables à la réalisation du projet implantaire et décidons du nombre, des caractéristiques et du positionnement des implants nécessaires à la réalisation…","Saignements, douleurs, gonflements. Ces signes annonciateurs d un problème gingival doivent inciter à consulter rapidement. Les bactéries sont passées sous la gencive et amorcent des \"dégâts\" dans les tissus sous jacents. Le responsable le plus fréquent : le biofilm ou plaque dentaire. Il y a risque de gingivite, voire de parodontite, si on ne traite pas. D où la nécessité de consulter son…","Le traitement chirurgical parodontal est adapté à la quantité de tissus détruits. Il peut être limité à la gencive, ou à la gencive et à l os alvéolaire pour supprimer les poches osseuses, éliminer les bactéries dans les lésions profondes, redonner à la gencive une forme fonctionnelle.","La maladie parodontale peut reprendre son évolution si les conditions de nettoyage ne sont pas rigoureusement respectées."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le t
