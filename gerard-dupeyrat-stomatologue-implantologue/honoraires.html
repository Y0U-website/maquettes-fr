nique qui permet un résultat stable et confortable dans le temps.","Selon votre objectif (éclaircir, corriger une forme, harmoniser plusieurs dents), nous orientons vers la solution la plus pertinente : blanchiment dentaire , facettes dentaires , céramiques dentaires , ou encore la restauration par bridge et couronne dentaire . L’idée : obtenir un résultat sur-mesure , cohérent et durable, avec le minimum d’intervention nécessaire."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"esthetique-dentaire-paris","titre":"Esthétique dentaire Paris 8"},{"route":"medias","titre":"Médias"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lignes":["Honoraires"]},"pied":{"note":"","badg
