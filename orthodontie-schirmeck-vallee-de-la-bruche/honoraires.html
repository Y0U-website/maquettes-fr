insi que de communiquer avec nos laboratoires et avec vous.","Pour une meilleure visualisation des anomalies dentaires et une meilleure planification de vos traitements , le cabinet d’orthodontie du Dr. NUSSBAUMER est équipé d’un espace dédié à la réalisation de radiographies en 2 dimensions (panoramique et téléradiographie de profil), mais également d’un scanner en 3 dimensions.","Les images en 3 dimensions, issues du cone beam ou CBCT (Cone Beam Computed Tomography), reflètent un progrès majeur en imagerie médicale.","Les anomalies dentaires, telles que les dents bloquées ou surnuméraires sont nettement mieux visualisées que sur une radiographie conventionnelle. Qui dit meilleure visualisation des anomalies, dit meilleure planification du plan de traitement . Le choix de la direction de traction des dents bloquées et des éventuelles extractions des dents surnuméraires sont largement améliorés.","La bouche héberge de nombreuses variétés de bactéries et de champignons. Tous ces micro-organismes, appelés collectivement flore buccale, constituent un écosystème : ils forment le biofilm buccal, un dépôt mou qui adhère et s’accumule sur les dents et entre les dents. Ces bactéries se nourrissent de sucres et des restes d’aliments présents dans la bouche."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitemen
