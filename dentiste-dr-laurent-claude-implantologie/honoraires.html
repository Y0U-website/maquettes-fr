ance…","Bien entendu, ces recommandations sont revues avec le docteur Laurent CLAUDE dans son cabinet de Pont-à-Mousson avant toute intervention.","C’est une racine artificielle qui va être intégrée à l’os de la mâchoire en une période de 3 mois à 4 mois. Il a la forme d’une cheville dans laquelle on visse un capuchon de cicatrisation dans un premier temps.","Votre dentiste traitant pourra ensuite réaliser une couronne sur un implant ou un bridge (ensemble de plusieurs dents) vissé sur plusieurs implants.","Pour retrouver un sourire esthétique et durable, la pose d’implants est la solution la plus sûre si vous avez perdu une voire plusieurs dents.","Le taux de succès à 20 ans est de 92 % quand tout est favorable. Bien sûr, vous ne souhaitez pas faire partie des 8 % qui ont des complications…","Alors, quelques changements sont nécessaires dans votre vie quotidienne, c’est l’occasion de faire le point, prendre conscience qu’avec de bonnes et belles dents, on va mieux vieillir, mais ce n’est pas tout…"]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"l
