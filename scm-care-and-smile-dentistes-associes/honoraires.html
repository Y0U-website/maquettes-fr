riaux, le…","Tout travail prothétique ne peut se substituer à une analyse esthétique afin de ne pas subir un travail prototypé, qui serait considéré comme impersonnel. En effet le sourire est aujourd’hui souvent perçu comme le reflet de la personnalité. Notre équipe étant sensibilisée à ces aspects fondamentaux, nous mettons tout en oeuvre afin de favoriser une écoute des désirs spécifiques des patients afin…","La dentisterie biomimétique privilégie une approche conservatrice et respectueuse de la dent naturelle, en donnant la priorité à sa préservation et à sa restauration de manière plus naturelle et durable."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"about-us","titre":"À propos de nous"},{"route":"our-spcialits","titre":"Nos spécilaités"},{"route":"dentbiom","titre":"Facettes dentaires Care & Smile…"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Confo
