oraire de la dent (pansement) est mise en place de façon à assurer…"},{"id":"soin","align":"right","rail":"Le soin","kicker":"03 — Le soin","titre":["Un geste préparé","avant d’être fait."],"corps":""},{"id":"suivi","align":"left","rail":"Le suivi","kicker":"04 — Le suivi","titre":["Ce qui se corrige","dans la durée."],"corps":""},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":""}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[],"titre":["Le cabinet"],"lede":"","paragraphes":["De plus, le cabinet développant un pôle de formation pratique, nous mettons à disposition de nos patients un second réseau de soins endodontiques géré par nos jeunes endodontistes en formation et contrôlés par des seniors et des enseignants de l’Institut Endosophie.","“Merci au docteur Sarah Attal ! Une excellente professionnelle qui vous explique le traitement et protocole à envisager. Très douce dans son geste. Environnement et accueil parfait et sérieux dans le suivi des patients. Bref, je vous la recommande fortement.”","“Très pro, compréhensible, accueil parfait 👌 elle nous a tout expliqué le traitement, la suite... Je suis satisfaite de mon rendez vous alors à dans 1 mois pour le suivie de ma fille de 11 ans que vous avez compris et réussi à rassuré.”","Adresse du cabinet 76 Avenue de la Bourdonnais - 75007 Paris","Nous vous accueillons sur demande de votre chirurgien-dentiste pour traiter les racines de vos dents, prendre en charge les traumas et les douleurs oro-faciales. Ces prises en charge peuvent être effectuées dans un cabinet dentaire de dentisterie généraliste, mais certaines situations spécifiques nécessitent l’intervention d’un spécialiste pour préserver votre dent.","En tant qu’endodonti
