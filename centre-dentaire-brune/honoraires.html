ogie","kicker":"03 — Implantologie","titre":["Remplacer une racine,","pas seulement une dent."],"corps":"Le confort ressenti est semblable à celui donné par les dents d’origine lorsqu’elles fournissaient une bonne fonction masticatoire."},{"id":"suivi","align":"left","rail":"Orthodontie","kicker":"04 — Orthodontie","titre":["Aligner sans","se cacher."],"corps":"L’ orthodontie permet de corriger les mauvais positionnements dentaires (dents mal alignées, dents qui se chevauchent, dents trop en avant ou trop en arrière, problème de béance entre les dents de la mâchoire supérieure et les dents de la mâchoire inférieure…"},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":""}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[],"titre":["Le cabinet"],"lede":"","paragraphes":["Comme leur nom l’indique, les prothèses dentaires amovibles peuvent être ôtées de la bouche, ne serait-ce que pour un nettoyage soigneux et obligatoire. Le premier type de prothèse amovible est une prothèse partielle. Elle s’appuie sur les gencives mais aussi sur les dents restantes à l’aide de crochets, ce qui la stabilise. Le deuxième type de prothèse amovible est une prothèse complète pour les…","Ces prothèses amovibles sont faites à base de résine et les dents sont soit en résine soit en porcelaine (les dents en porcelaine étant plus fragiles). Il faudra, pour la pose de ces prothèses amovibles, plusieurs consultations chez votre dentiste ou dans votre centre dentaire pour un ajustement optimum. Les dentiers amovibles sont moins chers que les prothèses dentaires non amovibles.","Le bridge remplace une ou plusieurs dents. Il prend appui sur les dents voisines qui sont meulées et servent alors de pilier pour soutenir la dent remplaçante qui repose sur la gencive.","L’inlay-onlay se fait sur dent vivante, contrairement à la couronne. Cette technique permet de restaurer une dent abimée par une carie et qu’on comblait avant par un plombage. L’inlay reconstruit l’intérieur de la dent. Il peut être métallique, composite ou en céramique. L’onlay répare la surface abimée par une carie ou des fissures. Les matériaux utilisés sont les mêmes que pour l’inlay.","L’implant est utilisé pour une ou plusieurs dents lorsque la racine a disparu. Le chirurgien-dentiste remplace alors celle-ci par une racine artificielle en titane appelée implant, fixée dans la mâchoire et s’intégrant entre 3 et 6 mois à l’os. Puis, il pose un pilier sur l’implant et installe alors la couronne sur implant (en céramique ou résine) qui remplace la dent.","L’implantologie permet le remplacement des dents par des racines artificielles appelée implant dentaire C’est un acte pratiqué par les chirurgiens-dentistes ou par des médecins spécialistes de la chirurgie maxillo-faciale et de la stomatologie.","Il faut dire que tout adulte ayant perdu une ou plusieurs dents et souhaitant retrouver une fonction masticatoire efficace peut poser des implant dentaire. Non seulement cette fonction indispensable au bien-être et à la santé (une bonne mastication est le préalable pour une bonne digestion), l’implantologie a une fonction esthétique. Autrement dit, le patient retrouvera le plaisir de sourire à…","Il ne faut pas oublier que la classique prothèse amovible (ou dentier) suppose l’utilisation d’un produit (colle) pour une bonne stabilisation dans la bouche, elle reste inconfortable et n’est pas supportée par beaucoup de patients."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"protheses-dentaires","titre":"Les prothèses dentaires"},{"route":"implant-dentaire","titre":"IMPLANT DENTAIRE SPECIALISTE"},{"route":"orthodontie","titre":"Orthodontie"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lignes":["Honoraires"]},"pied":{"note":"","badge":"Proposition de maquette"},"demo":true}</script>
