rmales avec un minimum de douleur ou de limitations.","L’arthroscopie est une technique chirurgicale minimale invasive qui permet aux médecins d’examiner et de traiter les problèmes à l’intérieur d’une articulation . l’aide d’un petit appareil optique appelé arthroscope , inséré à travers une petite incision, le chirurgien peut visualiser l’articulation en détail, et effectuer des interventions correctives si nécessaire, tout en minimisant le…","La chirurgie du pied est une spécialité chirurgicale visant à traiter diverses affections et pathologies qui affectent le pied et la cheville. Cela peut inclure des procédures pour corriger des déformations comme le hallux valgus (oignon), des chirurgies pour réparer des fractures ou des lésions ligamentaires, ainsi que des interventions pour traiter des problèmes comme l’arthrite ou les…","La traumatologie est une branche de la médecine spécialisée dans le diagnostic et le traitement des blessures physiques causées par des chocs externes ou des accidents. Cela peut inclure des fractures osseuses, des dislocations, des entorses et des lésions des tendons et ligaments."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de rembourseme
