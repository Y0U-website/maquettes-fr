uées en métal ou en céramique transparente. Dans ces brackets un fil en métal est inséré. Il est attaché par une ligature en plastique ou en métal, qui va permettre de guider le déplacement des dents. Ces bagues peuvent êtres collées sur la face extérieure des dents (visible) ou sur la face interne (invisible).","Acide hyaluronique, toxine botulique, peeling, biorevitalisation, skinbooster, laser épilatoire, fils tenseurs, hyperhydrose, Plasma Riche en Plaquette (PRP), Blépharoplastie médicale (Plexr) Nous vous proposons une prise en charge globale de la beauté du visage et du corps, de manière non invasive.","Avec l’âge, la production d’acide hyaluronique diminue, ce qui peut entraîner une perte d’élasticité et l’apparition de rides. Les injections d’acide hyaluronique sont utilisées pour combler les rides et ridules, redonner du volume à certaines zones du visage et améliorer l’apparence des cernes sous les yeux."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"honoraires","titre":"Honoraires"}],"pa
