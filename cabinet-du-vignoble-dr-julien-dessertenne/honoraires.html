gner sans","se cacher."],"corps":"Chirurgien-dentiste de formation, le Dr. Julien Dessertenne a complété son parcours par un Diplôme Universitaire d’orthodontie."},{"id":"resultat","align":"center","rail":"Le résultat","kicker":"05 — Le résultat","titre":["Ce qu’on voit","quand vous souriez."],"corps":"L’orthodontie est un traitement dentaire visant à corriger les défauts de positionnement des dents, des mâchoires et des os. Le but n’est pas seulement esthétique, il est aussi fonctionnel et permet d’éviter bien des complications."}],"editorial":{"charniere":{"titre":["Voilà pour","la démonstration."],"lede":"Ce qu’une animation ne dira jamais : combien ça coûte, combien de temps ça prend, et où nous trouver. C’est écrit plus bas."},"cabinet":{"kicker":"Le cabinet","chiffres":[],"titre":["Le cabinet"],"lede":"","paragraphes":["Reims - Sillery : 10 min Épernay - Sillery : 25 min Châlons - Sillery : 25 min Rethel - Sillery : 30 min","Dans le cadre de son mémoire, il s’est intéressé au rôle de l’occlusion dentaire dans la correction des déséquilibres posturologiques. En effet, les articulations temporo-mandibulaires jouent un rôle central dans l’équilibre du corps. Un mauvais alignement dentaire ou une occlusion défectueuse peuvent être à l’origine de diverses pathologies, telles que des douleurs cervicales, rachidiennes, des…","Conscient de l’importance d’une prise en charge précoce, il met l’accent sur le dépistage et le traitement des déséquilibres dès le plus jeune âge. Un suivi orthodontique adapté permet d’agir sur la croissance et de réduire le risque d’interventions chirurgicales, notamment en tenant compte du pic de croissance, qui survient autour de 11 ans chez les filles et 12 ans chez les garçons.","Avant d’exercer en tant que chirurgien-dentiste pratiquant l’orthodontie, le Dr. Dessertenne a travaillé plusieurs années en tant que podologue. Cette expertise complémentaire lui confère une approche globale de la posture et de la santé dentaire. Il collabore étroitement avec des professionnels de santé tels que podologues, kinésithérapeutes et ostéopathes afin d’assurer une prise en charge…","Titulaire d’un master en droit pénal et criminologie, Romane a choisi de transposer sa rigueur et son expertise juridique ainsi que sa capacité d’analyse au domaine de la gestion d’un cabinet d’orthodontie et est aujourd’hui juriste au sein du Cabinet du Vignoble, cabinet qu’elle a fondé et développé avec passion. En tant que gérante et responsable juridique, elle assure la direction et veille à…","Dès la création du cabinet, elle a imaginé un espace chaleureux, élégant et pensé pour le bien-être des patients. De la maison qui l’abrite à chaque élément de décoration, elle a façonné un lieu accueillant, où chaque petit détail fait la différence, loin de l’ambiance froide des structures médicales traditionnelles.","Son rôle englobe la gérance globale et l’organisation interne du cabinet, la gestion administrative et financière, la stratégie de développement, ainsi que la direction des ressources humaines incluant la supervision des équipes et du parcours patient.","Elle assure la gestion des plannings et l’optimisation des protocoles de travail pour offrir un service fluide et efficace."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"equipe","titre":"Équipe"},{"route":"equipement","titre":"Équipement"},{"route":"esthetique","titre":"Esthetique"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lignes":["Honoraires"]},"pied":{"note":"","badge":"Proposition de maquette"},"demo":true}</script>
