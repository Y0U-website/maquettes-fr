t agréable, en adoptant une approche individualisée pour répondre précisément à vos besoins. Notre cabinet est équipé de technologies avancées comme les empreintes numériques et les imprimantes 3D, pour des traitements plus confortables, plus discrets et plus efficaces.","Pour votre enfant, il est recommandé de programmer une consultation de dépistage chez l’orthodontiste lorsqu’il atteint l’âge de 7 ou 8 ans. L’objectif de cette consultation de dépistage est de corriger une déformation de la mâchoire et des dents par un traitement « interceptif » ou « précoce » en cas de nécessité. Les traitements d’orthodontie précoce permettent de favoriser la bonne croissance…","Nos traitements s’adressent aussi bien aux enfants qu’aux adultes et même aux seniors. En effet, il n’y a pas d’âge pour commencer un traitement d’orthodontie. Si vous souhaitez résoudre un désordre fonctionnel ou aligner vos dents, vous pouvez prendre rendez-vous au cabinet.","Orthodontiste Formations universitaires 2021 : Diplôme d’Etudes Spécialisée en Orthopédie-Dento-Faciale – Université Nice Sophia Antipolis 2020 : Diplôme d’État de Docteur en Chirurgie Dentaire – Université Aix-Marseille 2018-2021 : Interne en Orthodontie – Centre Hospitalier Universitaire Saint Roch – Nice 2013-2015 : Master 1 Recherche Sciences Humaines et Sociales – Université Aix- Marseille…","Le choix d’un traitement dépend de plusieurs facteurs tels que votre âge, le diagnostic et l’origine des anomalies squelettiques et dentaires . Lors d’un rendez- vous dédié aux explications du traitement, l’orthodontiste prendra le temps de vous présenter tous ces éléments et vous guidera vers les techniques les plus appropriées pour obtenir un résultat optimal.","Dans de nombreux cas, le traitement orthodontique implique la collaboration d’autres professionnels de santé, tels que les chirurgiens-dentistes, les orthophonistes, les ORL, les chirurgiens maxillo-faciaux, les kinésithérapeutes, et bien d’autres. Si votre cas nécessite une prise en charge pluridisciplinaire, nous nous assurons de vous fournir les courriers nécessaires et de suivre attentivement…","Au cours de votre traitement, des auxiliaires tels les élastiques seront utilisés pour stimuler la croissance des mâchoires, favoriser le bon déplacement des dents et permettre leurs bon « emboitement » ."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"lequipe","titre":"L’équipe"},{"route":"les-traitements","titre":"Les Traitements"},{"route":"conseils-et-prevention","titre":"Conseils et Prévention"},{"route":"le-cabinet","titre":"Le Cabinet"},{"route":"contact-et-acces","titre":"Contact et Accès"},{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dans les mêmes conditions que tout patient.","manque":true,"lign
