ales pourvoyeuses d’Insuffisance Faciale : l’Insuffisance d’Avancée est BiMaxillaire , et d’autant moins repérée.","Le préalable Vertical Linguo-Ramal LR , suivi de l’Avancée BiMaxillaire Occluso-Corticale OC , qu’autorisent les Thérapeutiques Linguo-Occlusales LROC, révolutionne l’abord des cas sans surplomb.","Comprendre l’Insuffisance Faciale, en particulier dans les cas de Classe I sans surplomb , change profondément la donne face au fléau du Syndrome d’Apnées Obstructives du Sommeil- SAOS, par manque d’espace pour les Voies Aériennes Supérieures , comme face à la DDM Dysharmonie Dento-Maxillaire , et aux troubles du Changement de Denture."]},"equipe":{"kicker":"L’équipe","titre":[],"lede":"","photo":"","gens":[]},"honoraires":{"kicker":"Soins et honoraires","titre":[],"lede":"","lignes":[],"mention":""},"engagements":{"kicker":"Votre parcours","titre":["Un premier rendez-vous,","pas à pas."],"items":[{"titre":"Prendre rendez-vous","corps":"Par téléphone, ou par la demande en bas de page : elle arrive au secrétariat, qui vous rappelle pour fixer l’heure. En cas de douleur, dites-le dès ce premier échange."},{"titre":"L’examen, d’abord","corps":"Le premier rendez-vous commence par un examen complet : on ne propose rien qu’on n’ait regardé. C’est aussi le moment de poser toutes vos questions."},{"titre":"Le devis, avant les soins","corps":"Pour tout traitement qui engage — prothèse, implant, orthodontie — un devis écrit vous est remis avant de commencer. Il détaille le tarif, la base de remboursement et ce qui reste à votre charge."}]},"rdv":{"kicker":"Prendre rendez-vous","titre":["Prendre","rendez-vous"],"lede":"","formulaire":true}},"pages":[{"route":"honoraires","titre":"Honoraires"}],"page":{"route":"honoraires","titre":"Honoraires","rubrique":"Soins et honoraires","chapeau":"","sections":[],"tarifs":[],"mention":"","acces":"Conformément à la loi, les bénéficiaires de la complémentaire santé solidaire (CSS) et de l’aide médicale de l’État (AME) sont reçus dan
